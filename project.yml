# XcodeGen spec. Regenerate the Xcode project with:  xcodegen generate
# (brew install xcodegen). Baxi.xcodeproj is git-ignored on purpose.
name: Baxi
options:
  bundleIdPrefix: com.vardaangoel
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 2VRPNLBW4H
    CODE_SIGN_STYLE: Automatic
targets:
  Baxi:
    type: application
    platform: iOS
    sources:
      - path: Baxi
    info:
      path: Baxi/Info.plist
      properties:
        CFBundleDisplayName: Baxi
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "Baxi follows your route during a drive so each cue is spoken at the right moment. Your location stays on this phone."
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [location, audio]
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  BaxiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BaxiTests
    dependencies:
      - target: Baxi
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  Baxi:
    build:
      targets:
        Baxi: all
        BaxiTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - BaxiTests
