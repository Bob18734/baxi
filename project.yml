# XcodeGen spec. Regenerate the Xcode project with:  xcodegen generate
# (brew install xcodegen). FirstRoads.xcodeproj is git-ignored on purpose.
name: FirstRoads
options:
  bundleIdPrefix: com.vardaangoel
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  FirstRoads:
    type: application
    platform: iOS
    sources:
      - path: FirstRoads
    info:
      path: FirstRoads/Info.plist
      properties:
        CFBundleDisplayName: FirstRoads
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: "FirstRoads shows the passenger where the car is on the practice route. The driver never uses the phone."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  FirstRoadsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FirstRoadsTests
    dependencies:
      - target: FirstRoads
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
schemes:
  FirstRoads:
    build:
      targets:
        FirstRoads: all
        FirstRoadsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FirstRoadsTests
